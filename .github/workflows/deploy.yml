name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Check build output
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Build output:"
          find . -maxdepth 4 -type f | sort | grep -E 'index\.html|assets/' || true
          
      - name: Add 404 fallback and .nojekyll
        run: |
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
            touch dist/.nojekyll
          else
            echo "ERROR: dist/index.html was not created"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
